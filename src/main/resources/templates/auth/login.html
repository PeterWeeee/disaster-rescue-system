<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(${pageTitle}, ~{::#login-content})}">
<body>

<div id="login-content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-header bg-navy text-white text-center py-4">
                        <i class="fa-solid fa-shield-halved text-danger fa-2x mb-2"></i>
                        <h4 class="fw-bold mb-0">ĐĂNG NHẬP HỆ THỐNG</h4>
                        <small class="text-white-50">CứuNạn 24/7 - Cổng thông tin điều phối & ứng cứu</small>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <div th:if="${param.error}" class="alert alert-danger small py-2">
                            <i class="fa-solid fa-circle-exclamation me-1"></i> Tên đăng nhập hoặc mật khẩu không chính xác!
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success small py-2">
                            <i class="fa-solid fa-circle-check me-1"></i> Bạn đã đăng xuất an toàn.
                        </div>

                        <form th:action="@{/auth/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên đăng nhập / Số điện thoại</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-user text-secondary"></i></span>
                                    <input type="text" class="form-control" name="username" required placeholder="Nhập tài khoản" autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
                                    <input type="password" class="form-control" name="password" required placeholder="Nhập mật khẩu">
                                </div>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary fw-bold py-2">
                                    <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập
                                </button>
                            </div>
                        </form>

                        <div class="text-center small text-muted">
                            Chưa có tài khoản? <a th:href="@{/auth/register}" class="fw-bold text-danger">Đăng ký ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
