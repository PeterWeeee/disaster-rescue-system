<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(${pageTitle}, ~{::#login-content})}">
<body>

<div id="login-content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-header bg-navy text-white text-center py-4">
                        <i class="fa-solid fa-shield-halved text-danger fa-2x mb-2"></i>
                        <h4 class="fw-bold mb-0">ĐĂNG NHẬP HỆ THỐNG</h4>
                        <small class="text-white-50">CứuNạn 24/7 - Cổng thông tin điều phối & ứng cứu</small>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <!-- Thông báo lỗi -->
                        <div th:if="${errorMessage}" class="alert alert-danger small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
                            <span th:text="${errorMessage}">Tên đăng nhập hoặc mật khẩu không chính xác!</span>
                        </div>
                        <div th:if="${param.error != null and errorMessage == null}" class="alert alert-danger small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
                            <span>Tên đăng nhập hoặc mật khẩu không chính xác!</span>
                        </div>

                        <!-- Thông báo thành công -->
                        <div th:if="${successMessage}" class="alert alert-success small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-check me-2 fs-5"></i>
                            <span th:text="${successMessage}">Thao tác thành công.</span>
                        </div>
                        <div th:if="${param.logout != null and successMessage == null}" class="alert alert-success small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-check me-2 fs-5"></i>
                            <span>Bạn đã đăng xuất tài khoản an toàn.</span>
                        </div>

                        <form th:action="@{/auth/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên đăng nhập / Số điện thoại</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-user text-secondary"></i></span>
                                    <input type="text" class="form-control" name="username" id="loginUsername" required placeholder="Nhập tài khoản hoặc SĐT" autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
                                    <input type="password" class="form-control" name="password" id="loginPassword" required placeholder="Nhập mật khẩu">
                                </div>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary fw-bold py-2 shadow-sm">
                                    <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập
                                </button>
                            </div>
                        </form>

                        <div class="text-center small text-muted mb-4">
                            Chưa có tài khoản? <a th:href="@{/auth/register}" class="fw-bold text-danger">Đăng ký ngay</a>
                        </div>

                        <!-- Gợi ý tài khoản demo -->
                        <div class="p-3 bg-light rounded-3 border">
                            <div class="small fw-bold text-secondary mb-2">
                                <i class="fa-solid fa-key text-warning me-1"></i> Tài khoản dùng thử (Mật khẩu: <code>123456</code>):
                            </div>
                            <div class="d-flex flex-wrap gap-1">
                                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="quickFill('admin')">Admin</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="quickFill('coordinator')">Điều phối</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="quickFill('rescuer')">Cứu hộ</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="quickFill('citizen')">Người dân</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function quickFill(user) {
    document.getElementById('loginUsername').value = user;
    document.getElementById('loginPassword').value = '123456';
}
</script>

</body>
</html>
