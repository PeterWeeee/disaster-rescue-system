<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(${pageTitle}, ~{::#forgot-content})}">
<body>

<div id="forgot-content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-header bg-navy text-white text-center py-4">
                        <i class="fa-solid fa-lock-open text-danger fa-3x mb-2"></i>
                        <h4 class="fw-bold mb-1">QUÊN MẬT KHẨU</h4>
                        <small class="text-white-50">Khôi phục quyền truy cập vào tài khoản của bạn</small>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <!-- Thông báo lỗi -->
                        <div th:if="${errorMessage}" class="alert alert-danger small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <!-- Thông báo thành công -->
                        <div th:if="${successMessage}" class="alert alert-success small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-check me-2 fs-5"></i>
                            <span th:text="${successMessage}"></span>
                        </div>

                        <p class="small text-muted text-center mb-4">
                            Vui lòng nhập địa chỉ Email liên kết với tài khoản. Hệ thống sẽ gửi mã OTP 6 chữ số để bạn đặt lại mật khẩu mới.
                        </p>

                        <form th:action="@{/auth/forgot-password}" method="post">
                            <div class="mb-4">
                                <label class="form-label fw-semibold small text-secondary">Địa chỉ Email đăng ký</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-envelope text-secondary"></i></span>
                                    <input type="email" class="form-control" name="email" id="forgotEmail" required 
                                           placeholder="vd: nguyenvana@gmail.com" autofocus>
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary fw-bold py-2 shadow-sm">
                                    <i class="fa-solid fa-paper-plane me-1"></i> Gửi Mã OTP Xác Thực
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3 pt-3 border-top small">
                            <a th:href="@{/auth/login}" class="text-secondary text-decoration-none">
                                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang Đăng nhập
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
