<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(${pageTitle}, ~{::#verify-otp-content})}">
<body>

<div id="verify-otp-content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-header bg-navy text-white text-center py-4">
                        <i class="fa-solid fa-envelope-circle-check text-warning fa-3x mb-2"></i>
                        <h4 class="fw-bold mb-1">XÁC THỰC KÍCH HOẠT</h4>
                        <small class="text-white-50">Nhập mã OTP 6 chữ số đã được gửi tới Email</small>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <!-- Thông báo thành công -->
                        <div th:if="${successMessage}" class="alert alert-success small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-check me-2 fs-5"></i>
                            <span th:text="${successMessage}"></span>
                        </div>

                        <!-- Thông báo lỗi -->
                        <div th:if="${errorMessage}" class="alert alert-danger small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <p class="small text-muted text-center mb-4">
                            Mã xác nhận bảo mật đã được gửi tới hòm thư: <br>
                            <strong class="text-dark fs-6" th:text="${email}">user@example.com</strong>
                        </p>

                        <form th:action="@{/auth/verify-otp}" method="post">
                            <input type="hidden" name="email" th:value="${email}">
                            <div class="mb-4">
                                <label class="form-label fw-bold text-center w-100 text-uppercase small text-secondary">
                                    Nhập mã OTP 6 chữ số:
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-key text-danger"></i></span>
                                    <input type="text" class="form-control text-center fs-3 fw-bold font-monospace tracking-wide" 
                                           name="otpCode" id="otpCode" maxlength="6" pattern="[0-9]{6}" required 
                                           placeholder="------" autofocus autocomplete="off">
                                </div>
                                <div class="form-text text-center small text-muted mt-2">
                                    <i class="fa-regular fa-clock me-1"></i> Mã có hiệu lực trong 10 phút.
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-danger fw-bold py-2 shadow-sm">
                                    <i class="fa-solid fa-shield-halved me-1"></i> Xác Nhận Kích Hoạt
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3 pt-3 border-top">
                            <span class="small text-muted">Chưa nhận được mã OTP?</span>
                            <form th:action="@{/auth/resend-otp}" method="post" class="d-inline">
                                <input type="hidden" name="email" th:value="${email}">
                                <button type="submit" class="btn btn-link btn-sm p-0 text-decoration-none fw-bold text-primary">
                                    Gửi lại mã mới
                                </button>
                            </form>
                        </div>

                        <div class="text-center mt-3 small">
                            <a th:href="@{/auth/login}" class="text-secondary text-decoration-none">
                                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang Đăng nhập
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
