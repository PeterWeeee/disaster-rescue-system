<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(${pageTitle}, ~{::#reset-content})}">
<body>

<div id="reset-content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-header bg-navy text-white text-center py-4">
                        <i class="fa-solid fa-key text-warning fa-3x mb-2"></i>
                        <h4 class="fw-bold mb-1">ĐẶT LẠI MẬT KHẨU</h4>
                        <small class="text-white-50">Nhập mã OTP và thiết lập mật khẩu mới</small>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <!-- Thông báo lỗi -->
                        <div th:if="${errorMessage}" class="alert alert-danger small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <!-- Thông báo thành công -->
                        <div th:if="${successMessage}" class="alert alert-success small py-2 d-flex align-items-center">
                            <i class="fa-solid fa-circle-check me-2 fs-5"></i>
                            <span th:text="${successMessage}"></span>
                        </div>

                        <p class="small text-muted text-center mb-4">
                            Mã OTP xác thực đã được gửi tới email: <br>
                            <strong class="text-dark fs-6" th:text="${email}">user@example.com</strong>
                        </p>

                        <form th:action="@{/auth/reset-password}" method="post">
                            <input type="hidden" name="email" th:value="${email}">

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-secondary">Mã OTP 6 chữ số</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-shield-halved text-danger"></i></span>
                                    <input type="text" class="form-control text-center fs-4 fw-bold font-monospace" 
                                           name="otpCode" maxlength="6" pattern="[0-9]{6}" required 
                                           placeholder="------" autofocus autocomplete="off">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Mật khẩu mới (tối thiểu 6 ký tự)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
                                    <input type="password" class="form-control" name="newPassword" required minlength="6" placeholder="Nhập mật khẩu mới">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small text-secondary">Xác nhận mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock-check text-secondary"></i></span>
                                    <input type="password" class="form-control" name="confirmPassword" required minlength="6" placeholder="Nhập lại mật khẩu mới">
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-success fw-bold py-2 shadow-sm">
                                    <i class="fa-solid fa-check-double me-1"></i> Lưu Mật Khẩu Mới
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3 pt-3 border-top small">
                            <a th:href="@{/auth/login}" class="text-secondary text-decoration-none">
                                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang Đăng nhập
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
