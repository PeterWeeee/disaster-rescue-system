<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head th:replace="~{fragments/head :: head(${title})}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Dynamic Content -->
    <main class="flex-grow-1">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <!-- Shared emergency alert overlay, available on every page -->
    <div class="modal fade" id="emergencyBroadcastModal" tabindex="-1" aria-hidden="true"
         data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow-lg">
            <div id="broadcastModalHeader" class="modal-header bg-danger text-white">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-triangle-exclamation me-2"></i>CẢNH BÁO KHẨN CẤP</h5>
            </div>
            <div class="modal-body p-4">
                <div id="broadcastAlertRegion" class="badge bg-danger-subtle text-danger mb-2"></div>
                <h4 id="broadcastAlertTitle" class="fw-bold"></h4>
                <p id="broadcastAlertContent" class="mb-0" style="white-space: pre-line"></p>
            </div>
            <div class="modal-footer"><button type="button" id="acknowledgeBroadcast" class="btn btn-danger fw-bold px-4">Tôi đã đọc và xác nhận</button></div>
        </div></div>
    </div>

    <!-- Core JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <script th:src="@{/js/alert-client.js}"></script>
    <script th:src="@{/js/main.js}"></script>

</body>
</html>
