spring:
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:cuunan247.vn@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
        transport:
          protocol: smtp
  application:
    name: disaster-rescue-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  config:
    import: "optional:classpath:application-secret.yml"
  thymeleaf:
    cache: false
    encoding: UTF-8
    servlet:
      produce-partial-output-while-processing: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Cloudinary Storage Configuration
# Toàn bộ thông tin bảo mật được nạp tự động từ file application-secret.yml (đã chặn bởi .gitignore)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

