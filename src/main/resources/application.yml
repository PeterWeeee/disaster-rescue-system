spring:
  application:
    name: disaster-rescue-system
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Cloudinary Storage Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:odwf5uoi}
  api-key: ${CLOUDINARY_API_KEY:329355988118811}
  api-secret: ${CLOUDINARY_API_SECRET:w6nY13mFiftdZCSg6Sqd0GdU4j0}

# Application & Emergency Hotlines Info
app:
  name: "CứuNạn 24/7"
  organization: "Ban Chỉ Đạo Ứng Phó Thiên Tai & Tìm Kiếm Cứu Nạn"
  hotlines:
    rescue: "112"
    fire: "114"
    medical: "115"
