spring:
  application:
    name: disaster-rescue-system
  profiles:
    active: sqlserver
  config:
    import: "optional:classpath:application-secret.yml"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Cloudinary Storage Configuration
# Các giá trị nhạy cảm được nạp tự động từ application-secret.yml (đã chặn bởi .gitignore)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:odwf5uoi}
  api-key: ${CLOUDINARY_API_KEY:329355988118811}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Application & Emergency Hotlines Info
app:
  name: "CứuNạn 24/7"
  organization: "Ban Chỉ Đạo Ứng Phó Thiên Tai & Tìm Kiếm Cứu Nạn"
  hotlines:
    rescue: "112"
    fire: "114"
    medical: "115"
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    cookie-name: jwt_token
