# =========================================================================
# MẪU FILE CẤU HÌNH BẢO MẬT CỤC BỘ (TEMPLATE)
# Hướng dẫn: Copy file này thành 'application-secret.yml' và điền mật khẩu của bạn.
# File 'application-secret.yml' đã được .gitignore bảo vệ, không bao giờ bị push lên GitHub.
# =========================================================================

spring:
  datasource:
    username: sa
    password: your_database_password_here

  # Cấu hình gửi Email OTP qua Gmail SMTP thực tế:
  # 1. Đăng nhập tài khoản Google và bật "Xác minh 2 bước" tại: https://myaccount.google.com/security
  # 2. Tạo Mật khẩu ứng dụng (App Password) tại: https://myaccount.google.com/apppasswords
  # 3. Bỏ dấu # và điền email cùng mật khẩu ứng dụng 16 ký tự vào dưới đây:
  # mail:
  #   username: your_email@gmail.com
  #   password: "your_16_char_app_password"

cloudinary:
  cloud-name: your_cloud_name_here
  api-key: your_api_key_here
  api-secret: your_api_secret_here

sepay:
  api-key: your_sepay_api_key_here

# Gửi Email thực tế trên Render Free Tier (Giao thức HTTPS Port 443 không bị Render chặn):
# 1. Đăng ký tài khoản miễn phí tại: https://resend.com
# 2. Tạo API Key tại mục API Keys (dạng re_xxxx)
# 3. Điền vào đây hoặc cấu hình biến môi trường RESEND_API_KEY trên Render:
resend:
  api-key: your_resend_api_key_here
