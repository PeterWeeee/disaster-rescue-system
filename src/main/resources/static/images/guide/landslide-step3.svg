<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f14" />
      <stop offset="100%" stop-color="#140d07" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#lsBg)"/>

  <!-- Title Banner -->
  <rect x="50" y="25" width="700" height="60" rx="12" fill="rgba(42, 31, 20, 0.9)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="62" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle">VÙNG NGUY CƠ CAO CẦN TRÁNH TUYỆT ĐỐI KHI CÓ SẠT LỞ &amp; LŨ QUÉT</text>

  <!-- Left: Dangerous Gully / Creek -->
  <g transform="translate(60, 110)">
    <rect width="320" height="290" rx="16" fill="#1f160e" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="20" y="20" width="140" height="28" rx="6" fill="#7f1d1d"/>
    <text x="90" y="39" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle">LÒNG SUỐI &amp; KHE TỤ THỦY</text>

    <!-- Mountain gully visual -->
    <path d="M40 190 L110 90 L160 160 L210 90 L280 190 Z" fill="url(#mountainGrad)"/>
    <!-- Mud / Debris flow path in gully -->
    <path d="M160 160 Q150 180 160 210" stroke="#b45309" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M160 160 Q150 180 160 210" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round" fill="none"/>

    <!-- Warning Sign -->
    <circle cx="260" cy="80" r="22" fill="#ef4444"/>
    <text x="260" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="22" text-anchor="middle">!</text>

    <text x="160" y="240" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Tránh xa dòng lũ quét và khe núi</text>
    <text x="160" y="265" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Đất đá cuồn cuộn có thể cuốn trôi nhà cửa</text>
  </g>

  <!-- Right: Dangerous Taluy / Cliff base -->
  <g transform="translate(420, 110)">
    <rect width="320" height="290" rx="16" fill="#1f160e" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="20" y="20" width="140" height="28" rx="6" fill="#7f1d1d"/>
    <text x="90" y="39" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle">CHÂN TALUY DỐC ĐỨNG</text>

    <!-- Steep Slope and House under it -->
    <path d="M60 90 L180 90 L220 200 L60 200 Z" fill="url(#mountainGrad)"/>
    <polygon points="175,100 195,115 185,130" fill="#f59e0b"/>
    <polygon points="190,140 210,155 200,170" fill="#d97706"/>
    <!-- House at base with red cross -->
    <path d="M225 170 L250 150 L275 170 L270 170 L270 200 L230 200 L230 170 Z" fill="#475569"/>
    <!-- Danger Cross -->
    <circle cx="260" cy="80" r="22" fill="#ef4444"/>
    <path d="M250 70 L270 90 M270 70 L250 90" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <text x="160" y="240" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Không trú ẩn ngay chân dốc cao</text>
    <text x="160" y="265" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Đất sạt lở từ trên cao đổ ập bất ngờ</text>
  </g>
</svg>